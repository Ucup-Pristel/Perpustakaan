name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Salin dist ke VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "frontend/dist/*"
          target: "/home/Perpustakaan/Perpustakaan/frontend/dist"
          strip_components: 2

      - name: Deploy backend & aktifkan via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/Perpustakaan/Perpustakaan
            git pull origin main
            npm install --production
            sudo mkdir -p /var/www/ucup-edu-lib/frontend/dist
            sudo cp -r /home/Perpustakaan/Perpustakaan/frontend/dist/. /var/www/ucup-edu-lib/frontend/dist/
            pm2 restart perpustakaan-api

