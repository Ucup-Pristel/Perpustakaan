# ucup-edu-lib :: Nginx reverse proxy untuk api.edulib.id
#
# Pasang:
#   sudo cp nginx/ucup-edu-lib.conf /etc/nginx/sites-available/api.edulib.id
#   sudo ln -s /etc/nginx/sites-available/api.edulib.id /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: sudo certbot --nginx -d api.edulib.id
#
# PENTING soal rate limiting: backend memakai `app.set('trust proxy', 1)`, jadi
# blok ini WAJIB memakai $proxy_add_x_forwarded_for (append IP peer), BUKAN
# $http_x_forwarded_for (meneruskan nilai kiriman klien apa adanya). Kalau salah,
# klien bisa mengarang X-Forwarded-For dan melewati authLimiter (5 login/15m).
# Node juga bind ke 127.0.0.1 (default server.js) supaya port 3000 tidak bisa
# dihubungi langsung dari internet, melewati Nginx sepenuhnya.

upstream ucup_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Lapis pertama rate limit, sebelum request mencapai Node.
limit_req_zone $binary_remote_addr zone=ucup_api_rl:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ucup_login_rl:10m rate=1r/s;

# Header proxy dipakai di semua location. Didefinisikan sekali di sini supaya
# tidak ada location yang lupa memasangnya (lupa = req.ip salah = limiter global).
# Dipakai dengan `include snippets/ucup-proxy.conf` setelah file ini disalin,
# atau cukup tetap inline seperti di bawah kalau tidak mau file tambahan.

server {
    listen 80;
    listen [::]:80;
    server_name api.edulib.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.edulib.id;

    ssl_certificate     /etc/letsencrypt/live/api.edulib.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.edulib.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # multer membatasi PDF 100 MB; beri ruang overhead multipart.
    # Tanpa ini Nginx menolak lebih dulu dengan 413 (default 1 MB).
    client_max_body_size 105M;
    client_body_timeout  300s;

    # Upload besar di-stream ke R2; jangan diputus di tengah jalan.
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    access_log /var/log/nginx/ucup-api.access.log;
    error_log  /var/log/nginx/ucup-api.error.log warn;

    # Login: target brute-force, dibatasi paling ketat.
    location = /api/auth/login {
        limit_req zone=ucup_login_rl burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://ucup_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Health check: bebas rate limit, tidak mengotori access log.
    location = /api/health {
        access_log off;

        proxy_pass http://ucup_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location /api/ {
        limit_req zone=ucup_api_rl burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://ucup_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
    }

    # Domain ini hanya melayani API. Path lain tidak perlu menyentuh Node.
    location / {
        return 404;
    }
}
