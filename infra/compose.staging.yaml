# Separate staging project. Does not create, update, or own PostgreSQL.
# Reuses the existing 'edulib_database' Docker network from the PostgreSQL stack.
name: edulib-staging

services:
  api:
    image: edulib-api:staging
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    init: true
    user: node
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${STAGING_DB_NAME:?STAGING_DB_NAME is required}
      DB_USER: ${STAGING_DB_USER:?STAGING_DB_USER is required}
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?STAGING_DB_PASSWORD is required}
      JWT_SECRET: ${STAGING_JWT_SECRET:?STAGING_JWT_SECRET is required}
      FRONTEND_URL: ${STAGING_FRONTEND_URL:-https://edulib.id,https://www.edulib.id}
      # Deliberately NO Resend/R2 credentials on initial staging.
      # Keep write-capable production integrations disabled until tested.
    expose:
      - "3000"
    networks:
      - app
      - database
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,size=64m
      - /var/run:rw,nosuid,size=8m
      - /tmp:rw,nosuid,size=8m
    ports:
      # Localhost only: use Termius SSH port forwarding to access staging.
      - "127.0.0.1:18081:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app: {}
  database:
    external: true
    name: edulib_database
