# Production reverse proxy for the portable stack (infra/compose.prod.yaml).
# Domain-agnostic on purpose: the certificate in TLS_DIR decides which name is
# served, so moving VPS needs no config edit. Upstream `api` is resolved on the
# private Compose network; port 3000 is never published on the host.
#
# Express uses `trust proxy: 1` = exactly one hop. X-Forwarded-For is REPLACED
# with the peer address (never forward client-supplied XFF), same as staging.
# If a CDN/proxy is ever put in front, trust config must be revisited first.

limit_req_zone $binary_remote_addr zone=edulib_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=edulib_login:10m rate=1r/s;

server_tokens off;

# Docker DNS, re-resolved: recreating the api container (new IP) needs no nginx restart.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream edulib_api {
    zone edulib_upstream 64k;
    server api:3000 resolve;
    keepalive 16;
}

# HTTP: ACME HTTP-01 challenges + redirect only.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # multer: PDF 100 MB + multipart overhead (matches legacy nginx config).
    client_max_body_size 105m;
    client_body_timeout  300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location = /api/health {
        access_log off;
        proxy_pass http://edulib_api;
    }

    location = /api/auth/login {
        limit_req zone=edulib_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://edulib_api;
    }

    location /api/ {
        limit_req zone=edulib_api burst=20 nodelay;
        limit_req_status 429;
        # Stream large uploads to Express/multer instead of buffering in nginx.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://edulib_api;
    }

    # API-only host.
    location / { return 404; }
}
