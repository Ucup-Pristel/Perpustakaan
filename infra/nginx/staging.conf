# Staging-only HTTP proxy. Public ingress is prevented by Docker loopback bind.
# SSH tunnel encrypts the client-to-host leg. Do not expose this config publicly.
limit_req_zone $binary_remote_addr zone=edulib_staging_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=edulib_staging_login:10m rate=1r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 105m;
    client_body_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Express uses trust proxy = 1. Replace (do not trust) incoming XFF.
    # This is one nginx -> Express proxy hop.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /api/health {
        access_log off;
        proxy_pass http://api:3000;
    }

    location = /api/auth/login {
        limit_req zone=edulib_staging_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:3000;
    }

    location /api/ {
        limit_req zone=edulib_staging_api burst=20 nodelay;
        limit_req_status 429;
        proxy_buffering off;
        proxy_pass http://api:3000;
    }

    location / { return 404; }
}
